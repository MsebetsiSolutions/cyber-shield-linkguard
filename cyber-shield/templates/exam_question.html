<!DOCTYPE html>
<html>
<head>
    <title>Week {{ week }} - Question {{ question_num }} - LinkGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .exam-container { max-width: 800px; margin: 0 auto; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .question-number { color: #6c757d; font-weight: 600; }
        .question-text { font-size: 1.2rem; line-height: 1.6; margin: 20px 0; }
        .option-label { padding: 15px; margin: 10px 0; border: 2px solid #e9ecef; border-radius: 10px; cursor: pointer; transition: all 0.3s; }
        .option-label:hover { border-color: #007bff; background-color: #f8f9fa; }
        .option-input:checked + .option-label { border-color: #007bff; background-color: #e7f3ff; }
        .progress-bar { height: 8px; border-radius: 4px; }
        .timer { font-size: 1.1rem; font-weight: bold; }
        .time-warning { color: #dc3545; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="exam-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-0">Week {{ week }} Assessment</h2>
                <div class="question-number">Question {{ question_num }} of {{ total_questions }}</div>
            </div>
            <div class="timer" id="timerDisplay">
                <i class="bi bi-clock"></i> <span id="time">60</span> seconds
            </div>
        </div>

        <div class="progress mb-4">
            <div class="progress-bar bg-primary" role="progressbar" 
                 style="width: {{ (question_num / total_questions * 100) }}%"
                 aria-valuenow="{{ question_num }}" 
                 aria-valuemin="0" 
                 aria-valuemax="{{ total_questions }}">
            </div>
        </div>

        <div class="question-section">
            <div class="question-text">{{ question_text }}</div>
            
            <form method="POST" action="{{ url_for('exam.handle_answer') }}" id="examForm">
                <div class="options-list">
                    {% for option in options %}
                    <div class="form-check mb-3">
                        <input class="form-check-input option-input" type="radio" 
                               name="answer" id="option{{ loop.index }}" value="{{ loop.index }}"
                               style="display: none;">
                        <label class="form-check-label option-label w-100" for="option{{ loop.index }}">
                            <strong>{{ ['A', 'B', 'C', 'D'][loop.index0] }}.</strong> {{ option }}
                        </label>
                    </div>
                    {% endfor %}
                </div>
                
                <input type="hidden" name="question_index" value="{{ question_index }}">
                
                <div class="text-end mt-4">
                    <button type="submit" class="btn btn-primary btn-lg px-5" id="submitBtn" disabled>
                        {% if question_num == total_questions %}
                            Finish Exam <i class="bi bi-flag-fill"></i>
                        {% else %}
                            Next Question <i class="bi bi-arrow-right"></i>
                        {% endif %}
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Timer functionality (60 seconds per question)
        let timeLeft = 60;
        const timerDisplay = document.getElementById('timerDisplay');
        const timeElement = document.getElementById('time');
        const submitBtn = document.getElementById('submitBtn');
        
        const timer = setInterval(() => {
            timeLeft--;
            timeElement.textContent = timeLeft;
            
            // Change color when time is running low
            if (timeLeft <= 10) {
                timerDisplay.classList.add('time-warning');
            }
            
            if(timeLeft <= 0) {
                clearInterval(timer);
                // Auto-submit the form when time runs out
                document.getElementById('examForm').submit();
            }
        }, 1000);

        // Enable submit button when an option is selected
        document.querySelectorAll('.option-input').forEach(radio => {
            radio.addEventListener('change', function() {
                submitBtn.disabled = false;
            });
        });

        // Auto-select when user clicks on option label
        document.querySelectorAll('.option-label').forEach(label => {
            label.addEventListener('click', function() {
                const radio = this.previousElementSibling;
                radio.checked = true;
                submitBtn.disabled = false;
            });
        });

        // Form submission handler
        document.getElementById('examForm').addEventListener('submit', function(e) {
            // Clear the timer when form is submitted
            clearInterval(timer);
        });
    </script>
</body>
</html>
