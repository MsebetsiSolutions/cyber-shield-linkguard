<div class="monitoring-page">
  <div class="grid two">
    <div class="card">
      <div class="card-head">
        <h3>Host Monitoring</h3>
      </div>
      <div id="hostsContainer" class="hosts-grid">
        <div class="loading">Loading hosts...</div>
      </div>
    </div>
    
    <div class="card">
      <div class="card-head">
        <h3>Network Traffic</h3>
        <div id="netStats" class="stats">Loading...</div>
      </div>
      <canvas id="hostTrafficChart" height="120"></canvas>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>PCAP Analysis</h3>
    </div>
    <div class="pcap-controls">
      <input type="file" id="pcapFile" accept=".pcap,.pcapng,.cap">
      <button id="btnAnalyzePcap" class="btn">Analyze PCAP</button>
      <button id="btnClearPcap" class="btn btn-secondary">Clear</button>
    </div>
    <div id="pcapSummary"></div>
    <div class="pcap-filter">
      <input type="text" id="pcapFilter" placeholder="Filter packets (IP, protocol, etc.)">
      <button id="btnApplyFilter" class="btn">Apply Filter</button>
      <button id="btnClearFilter" class="btn btn-secondary">Clear Filter</button>
    </div>
    <div class="pcap-results">
      <div class="packet-list">
        <table>
          <thead>
            <tr>
              <th>No.</th><th>Time</th><th>Source</th><th>Destination</th><th>Protocol</th><th>Length</th><th>Info</th>
            </tr>
          </thead>
          <tbody id="packetList"></tbody>
        </table>
      </div>
      <div class="packet-details">
        <h4>Packet Details</h4>
        <div id="packetDetails"></div>
      </div>
    </div>
  </div>

  

  <div class="card">
    <div class="card-head">
      <h3>Quick Port Scan</h3>
    </div>
    <div class="port-scan-controls">
      <input type="text" id="qpIp" placeholder="Target IP/Hostname">
      <input type="number" id="qpStart" placeholder="Start Port" value="1">
      <input type="number" id="qpEnd" placeholder="End Port" value="1024">
      <button id="qpRun" class="btn">Scan</button>
      <button id="qpClear" class="btn btn-secondary">Clear</button>
    </div>
    <table>
      <thead>
        <tr><th>Port</th><th>Status</th><th>Service</th></tr>
      </thead>
      <tbody id="qpBody"></tbody>
    </table>
  </div>
</div>


<script src="/soc/assets/js/monitoring.js"></script>



<style>
.hosts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1rem;
}

.host-card {
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1rem;
  background: var(--card-bg);
}

.host-card.healthy { border-left: 4px solid #10b981; }
.host-card.warning { border-left: 4px solid #f59e0b; }
.host-card.critical { border-left: 4px solid #ef4444; }

.status-badge {
  padding: 0.25rem 0.5rem;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: 600;
  color: white;
}

.status-badge.healthy { background: #10b981; }
.status-badge.warning { background: #f59e0b; }
.status-badge.critical { background: #ef4444; }

.analysis-summary {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1rem;
  margin: 1rem 0;
}

.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1rem;
  margin-bottom: 1rem;
}

.protocols {
  border-top: 1px solid var(--border);
  padding-top: 1rem;
}

.protocol-item {
  display: flex;
  justify-content: space-between;
  margin-bottom: 0.5rem;
}

.pcap-controls, .port-scan-controls, .pcap-filter {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}

.pcap-results {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 1rem;
  margin-top: 1rem;
}

.packet-list {
  max-height: 400px;
  overflow-y: auto;
}

.packet-details {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1rem;
}

.protocol-layer {
  margin-bottom: 0.5rem;
  padding: 0.25rem 0;
  border-bottom: 1px solid var(--border);
}

.packet-row {
  cursor: pointer;
}

.packet-row:hover {
  background: var(--hover) !important;
}

.protocol {
  padding: 0.1rem 0.4rem;
  border-radius: 3px;
  font-size: 0.8rem;
  font-weight: 600;
}

.protocol.tcp { background: #3b82f6; color: white; }
.protocol.udp { background: #8b5cf6; color: white; }
.protocol.http { background: #10b981; color: white; }
.protocol.dns { background: #f59e0b; color: white; }
.protocol.icmp { background: #ef4444; color: white; }
</style>
