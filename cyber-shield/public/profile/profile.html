<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Profile | Msebetsi Solutions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="profile.css">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-touch-icon.png" />
</head>

<body>

  <div class="container-fluid py-4">
    <!-- Header with logo -->
    <header class="profile-header mb-4">
      <a href="../ScannerDash/ScannerDash.html" class="logo-link">
        <img src="../assets/CYBER_SHIELD_LINKGUARD2.png" alt="Cyber Shield LinkGuard" class="header-logo">
      </a>
    </header>

    <div class="profile-background">
      <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
      </div>

      <main class="profile-card cs-card p-4" id="profileCard">
        <!-- Loading state -->
        <div class="loading-state" id="loadingState">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-3">Loading your profile...</p>
        </div>

        <!-- Profile content (hidden initially) -->
        <div class="profile-content hidden" id="profileContent">
          <div class="row">
            <!-- First Column -->
            <div class="col-md-6">
              <div class="avatar-container">
                <div class="avatar" id="profileAvatar">U</div>
                <div class="verified-badge">
                  <i class="bi bi-patch-check-fill"></i>
                </div>
              </div>

              <h2 id="profileName">Loading...</h2>
              <p id="profileEmail" class="cs-sub">Please wait</p>

              <div class="profile-stats">
                <div class="stat-item">
                  <div class="stat-value" id="scansCount">0</div>
                  <div class="stat-label">Total Scans</div>
                </div>
              </div>

              <div class="security-status">
                <h4>Security Status</h4>
                <div class="security-indicator">
                  <div class="progress">
                    <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0"
                      aria-valuemax="100" title="Security Progress"></div>
                  </div>
                  <p class="security-score">Good <span>0%</span></p>
                </div>
              </div>
            </div>

            <!-- Second Column -->
            <div class="col-md-6">
              <div class="plan-section">
                <h4>Your Current Plan</h4>
                <div class="plan-card cs-card p-3">
                  <span id="planMode" class="plan-badge free-plan">FREE PLAN</span>
                  <div class="plan-features">
                    <p><i class="bi bi-check-circle-fill"></i> Basic scanning</p>
                    <p><i class="bi bi-check-circle-fill"></i> 5 scans per day</p>
                    <p><i class="bi bi-x-circle"></i> Advanced threat detection</p>
                  </div>
                  <button class="cs-btn btn-subscribe w-100"
                    onclick="window.location.href='../Subscription/Subscription.html'">
                    Upgrade Plan
                  </button>
                </div>
              </div>

              <!-- Actions -->
              <div class="actions mt-4" id="profileActions">
                <a href="../settings/settings.html" class="cs-btn btn-settings w-100">
                  <i class="bi bi-gear me-2"></i> Settings
                </a>
              </div>
            </div>
          </div>
        </div>
      </main>

      <footer class="text-center cs-sub mt-4">© Msebetsi Solutions Pty Ltd</footer>
    </div>
  </div>

  <script src="../session.js"></script>
  <script src="profile.js" defer></script>
</body>

</html>
