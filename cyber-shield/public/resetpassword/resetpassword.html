<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fddde6" />
  <title>Cyber Shield LinkGuard - Reset Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="resetpassword.css">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png" />
  <link rel="manifest" href="../assets/favicon/site.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
</head>

<body>
  <div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <!-- Reset Password Form -->
        <section id="resetPasswordForm" class="cs-card p-4">
          <div class="text-center mb-4">
            <img src="../assets/CYBER_SHIELD_LINKGUARD2.png" alt="Cyber Shield LinkGuard Logo" class="logo-image mb-3"
              style="max-width: 180px; height: auto;">
            <h2 class="cs-candy-title text-center mb-2">Reset Password</h2>
            <p class="cs-sub">Enter your new password below</p>
          </div>

          <div class="position-relative mb-3">
            <i class="bi bi-lock input-icon"></i>
            <input id="newPassword" class="cs-input with-icon" type="password" placeholder="New Password"
              autocomplete="new-password" />
            <i class="bi bi-eye-slash toggle-password" id="toggleNewPassword" role="button" tabindex="0"
              aria-label="Show password"></i>
          </div>

          <div class="position-relative mb-4">
            <i class="bi bi-lock-fill input-icon"></i>
            <input id="confirmPassword" class="cs-input with-icon" type="password" placeholder="Confirm New Password"
              autocomplete="new-password" />
            <i class="bi bi-eye-slash toggle-password" id="toggleConfirmPassword" role="button" tabindex="0"
              aria-label="Show password"></i>
          </div>

          <button id="doReset" class="cs-btn btn-login mb-3 w-100">
            <i class="bi bi-check-circle me-2"></i>Update Password
          </button>
        </section>

        <footer class="text-center cs-sub mt-4">© Msebetsi Solutions Pty Ltd</footer>
      </div>
    </div>
  </div>

  <!-- Floating Support Button -->
  <div class="floating-support-btn" id="supportBtn" title="Get Support">
    <i class="bi bi-headphones"></i>
  </div>

  <!-- Support Modal -->
  <div class="modal-overlay" id="supportModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2><i class="bi bi-headphones me-2"></i>Contact Support</h2>
        <button class="close-modal" id="closeSupportModal">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="modal-body">
        <form id="supportForm">
          <div class="row g-3">
            <div class="col-12">
              <label for="supportEmail" class="form-label">Email Address</label>
              <div class="position-relative">
                <i class="bi bi-envelope input-icon"></i>
                <input type="email" class="cs-input with-icon" id="supportEmail" placeholder="Your email address" required>
              </div>
            </div>

            <div class="col-12">
              <label for="supportHeading" class="form-label">Subject</label>
              <div class="position-relative">
                <i class="bi bi-chat-square-text input-icon"></i>
                <input type="text" class="cs-input with-icon" id="supportHeading" placeholder="Brief subject of your issue" required>
              </div>
            </div>

            <div class="col-12">
              <label for="supportDescription" class="form-label">Description</label>
              <div class="position-relative">
                <i class="bi bi-pencil-square input-icon" style="top: 1.2rem;"></i>
                <textarea class="cs-input with-icon" id="supportDescription" placeholder="Please describe your issue in detail..." rows="4" style="padding-top: 1rem; padding-bottom: 1rem;" required></textarea>
              </div>
            </div>

            <div class="col-12">
              <button type="button" id="submitSupport" class="cs-btn btn-login w-100">
                <i class="bi bi-send me-2"></i> Request
              </button>
            </div>

            <div class="col-12 text-center">
              <small class="text-muted">We'll get back to you within 3 hours</small>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../session.js"></script>
  <script src="resetpassword.js"></script>
</body>

</html>
