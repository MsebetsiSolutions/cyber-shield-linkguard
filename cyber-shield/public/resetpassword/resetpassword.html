<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#fddde6" />
  <title>Cybershield LinkGuard - Reset Password</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="resetPassword.css">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png" />
  <link rel="manifest" href="../assets/favicon/site.webmanifest" />
</head>
<body>
  <div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <!-- Reset Password Form -->
        <section id="resetPasswordForm" class="cs-card p-4">
          <div class="text-center mb-3">
            <i class="bi bi-shield-check cs-candy-title" style="font-size: 2.5rem;"></i>
            <h2 class="cs-candy-title text-center mb-3">Reset Password</h2>
            <p class="cs-sub">Enter your new password below</p>
          </div>
          
          <div class="position-relative mb-3">
            <i class="bi bi-lock input-icon"></i>
            <input id="newPassword" class="cs-input with-icon" type="password" placeholder="New Password" autocomplete="new-password" />
          </div>
          
          <div class="position-relative mb-3">
            <i class="bi bi-lock-fill input-icon"></i>
            <input id="confirmPassword" class="cs-input with-icon" type="password" placeholder="Confirm New Password" autocomplete="new-password" />
          </div>
          
          <button id="doReset" class="cs-btn btn-login mb-3 w-100">
            <i class="bi bi-check-circle me-2"></i>Update Password
          </button>
          
          <div class="text-center">
            <a href="../login/login.html" class="btn-link">
              <i class="bi bi-arrow-left me-2"></i>Back to Login
            </a>
          </div>
        </section>
        
        <footer class="text-center cs-sub mt-4">© Msebetsi Solutions Pty Ltd</footer>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="resetPassword.js"></script>
</body>
</html>
