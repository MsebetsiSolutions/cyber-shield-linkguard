<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Verification</title>
    <link rel="stylesheet" href="start-enter.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon/favicon-32x32Enterprice.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicon/favicon-16x16Enterprice.png" />
    <link rel="manifest" href="assets/favicon/site.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
</head>

<body>
    <div class="african-background"></div>

    <a href="../../ScannerDash/ScannerDash.html" class="logo-link">
        <img src="../../assets/CYBER_SHIELD_LINKGUARD2.png" alt="Cyber Shield LinkGuard" class="header-logo">
    </a>

    <div class="container">
        <div class="left-column">
            <div class="avatar-container">
                <img src="../../assets/welcomeavar.png" alt="Welcome Avatar" class="avatar">
            </div>
            <div class="welcome-message">
                <h1>Enterprise Access</h1>
                <p>Please verify your identity to access the enterprise dashboard.</p>
            </div>
        </div>

        <div class="right-column">
            <div class="form-container">
                <div class="security-header">
                    <i class="fas fa-shield-alt"></i>
                    <h2>Enterprise Verification</h2>
                </div>
                <form id="verificationForm">
                    <div class="form-group">
                        <label for="companyName">
                            <i class="fas fa-building"></i> Company Name
                        </label>
                        <input type="text" id="companyName" name="companyName" required>
                    </div>

                    <div class="form-group">
                        <label for="verificationCode">
                            <i class="fas fa-key"></i> Verification Code
                        </label>
                        <div class="code-display" id="codeDisplay">
                            <!-- Generated code will appear here -->
                        </div>
                        <input type="text" id="verificationCode" name="verificationCode"
                            placeholder="Enter the code above" required>
                    </div>

                    <button type="submit" id="submitBtn">
                        <i class="fas fa-shield-alt"></i> Verify & Continue
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="../../session.js"></script>
    <script src="start-enter.js"></script>
</body>

</html>
