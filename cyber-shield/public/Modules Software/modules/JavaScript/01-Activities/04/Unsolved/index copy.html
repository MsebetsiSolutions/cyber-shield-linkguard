<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Msebetsi Team Intro - Solution</title>
</head>
<body>
    <h1>Msebetsi Team Introductions - Solution</h1>
    <p>Open Console (F12) to see the team introduction!</p>

    <script>
        // ============================================
        // MSEBETSI TEAM INTRODUCTION - SOLUTION
        // ============================================
        
        console.log("=== Msebetsi Team Introductions ===");
        
        // Step 1: First developer's information
        // Using let for name and experience because we'll reassign them
        let developerName = "Thabo Molefe";
        let yearsExperience = 3;
        const favoriteTech = "JavaScript"; // Won't change
        
        // Step 2: First developer introduction
        console.log(`👋 Hello! My name is ${developerName}`);
        console.log(`💼 I have ${yearsExperience} years of development experience`);
        console.log(`🚀 My favorite technology is ${favoriteTech}`);
        
        console.log("\n=== Partner Introduction ===");
        
        // Step 3: Partner's information (reassigning variables)
        developerName = "Lerato Nkosi";     // Reassigning let variable
        yearsExperience = 5;                 // Reassigning let variable
        // favoriteTech = "Python";          // Can't reassign const - would cause error!
        const partnerFavoriteTech = "Python"; // Create new const for partner
        
        // Step 4: Partner introduction
        console.log(`👋 Hello! My name is ${developerName}`);
        console.log(`💼 I have ${yearsExperience} years of development experience`);
        console.log(`🚀 My favorite technology is ${partnerFavoriteTech}`);
        
        console.log("\n=== Team Message ===");
        
        // Step 5: Create team summary
        const firstDevName = "Thabo Molefe";
        const secondDevName = "Lerato Nkosi";
        const firstDevExp = 3;
        const secondDevExp = 5;
        
        const combinedExperience = firstDevExp + secondDevExp;
        const teamTechStack = `JavaScript & ${partnerFavoriteTech}`;
        
        console.log(`🤝 Team: ${firstDevName} & ${secondDevName}`);
        console.log(`📊 Combined Experience: ${combinedExperience} years`);
        console.log(`🛠️ Tech Stack: ${teamTechStack}`);
        
        // Bonus: Different ways to combine strings and variables
        console.log("\n=== Bonus: String Concatenation Examples ===");
        
        // Method 1: Template literals (best)
        console.log(`Template: ${firstDevName} + ${secondDevName}`);
        
        // Method 2: Concatenation with +
        console.log("Concatenation: " + firstDevName + " + " + secondDevName);
        
        // Method 3: Watch out for this!
        console.log("Careful with numbers: " + firstDevExp + secondDevExp); // "35"
        console.log("Correct way: " + (firstDevExp + secondDevExp)); // "8"
        
        console.log("\n✅ Activity Complete! All variables mastered!");
    </script>
</body>
</html>
