<!DOCTYPE html>
<html lang="en-ZA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 18: CSS Box Model | Msebetsi Solutions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="dashboard-header">
        <h1>AfricaConnect Operations Dashboard</h1>
        <p>Regional Performance Monitoring</p>
    </header>
    
    <main class="dashboard-container">
        <!-- Student Task: Implement box model properties for these pods -->
        
        <!-- South Africa Pod -->
        <div class="region-pod" id="south-africa">
            <h2>South Africa</h2>
            <div class="metrics">
                <div class="metric">Uptime: 99.98%</div>
                <div class="metric">Latency: 12ms</div>
            </div>
            <button class="pod-action">View Details</button>
        </div>
        
        <!-- Kenya Pod -->
        <div class="region-pod" id="kenya">
            <h2>Kenya</h2>
            <div class="metrics">
                <div class="metric">Uptime: 99.85%</div>
                <div class="metric">Latency: 45ms</div>
            </div>
            <button class="pod-action">View Details</button>
        </div>
        
        <!-- Nigeria Pod -->
        <div class="region-pod" id="nigeria">
            <h2>Nigeria</h2>
            <div class="metrics">
                <div class="metric">Uptime: 99.97%</div>
                <div class="metric">Latency: 85ms</div>
            </div>
            <button class="pod-action">View Details</button>
        </div>
        
        <!-- Ghana Pod -->
        <div class="region-pod" id="ghana">
            <h2>Ghana</h2>
            <div class="metrics">
                <div class="metric">Uptime: 99.65%</div>
                <div class="metric">Latency: 120ms</div>
            </div>
            <button class="pod-action">View Details</button>
        </div>
    </main>
    
    <footer class="dashboard-footer">
        <p>© 2024 Msebetsi Solutions | AfricaConnect Dashboard</p>
    </footer>
</body>
</html>
