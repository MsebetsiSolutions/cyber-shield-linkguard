<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearningHub - Course Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --secondary: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #1e293b;
            --gray: #64748b;
            --light-gray: #f1f5f9;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 18px auto 0; /* push content below sticky header */
            padding: 0 16px;
        }

        /* Header (full-width sticky) */
        .header {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            background: white;
            z-index: 1050;
            box-shadow: 0 6px 18px rgba(2,6,23,0.08);
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .logo h1 {
            font-size: 28px;
            color: var(--dark);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        /* Main Editor Container */
        .editor-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .editor-header {
            padding: 30px;
            border-bottom: 2px solid var(--border);
        }

        .editor-header h2 {
            font-size: 28px;
            color: var(--dark);
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Text Editor Section */
        .text-editor-section {
            padding: 30px;
        }

        .editor-label {
            font-weight: 600;
            color: var(--dark);
            font-size: 14px;
            margin-bottom: 15px;
            display: block;
        }

        /* Toolbar */
        .toolbar {
            background: var(--light-gray);
            padding: 15px;
            border-radius: 10px 10px 0 0;
            border: 2px solid var(--border);
            border-bottom: none;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .toolbar-group {
            display: flex;
            gap: 5px;
            padding-right: 10px;
            border-right: 2px solid var(--border);
        }

        .toolbar-group:last-child {
            border-right: none;
        }

        .toolbar-btn {
            padding: 8px 12px;
            background: white;
            border: 2px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            color: var(--dark);
            min-width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toolbar-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .toolbar-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .toolbar-select {
            padding: 8px 12px;
            border: 2px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }

        .color-picker-wrapper {
            position: relative;
            display: inline-block;
        }

        .color-picker {
            width: 40px;
            height: 36px;
            border: 2px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            background: white;
        }

        /* Editor Content Area */
        .editor-content {
            min-height: 400px;
            padding: 20px;
            border: 2px solid var(--border);
            border-radius: 0 0 10px 10px;
            background: white;
            font-size: 16px;
            line-height: 1.6;
            overflow-y: auto;
            max-height: 600px;
        }

        .editor-content:focus {
            outline: none;
            border-color: var(--primary);
        }

        .editor-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 10px 0;
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-secondary {
            background: var(--gray);
            color: white;
        }

        .btn-secondary:hover {
            background: var(--dark);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .editor-actions {
            padding: 30px;
            border-top: 2px solid var(--border);
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        /* Modal for Links and Images */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 20px;
            color: var(--dark);
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--gray);
        }

        .preview-area {
            margin-top: 20px;
            padding: 15px;
            background: var(--light-gray);
            border-radius: 8px;
            min-height: 60px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .toolbar {
                gap: 5px;
            }

            .toolbar-group {
                padding-right: 5px;
            }

            .header {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Full-width sticky header -->
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">LH</div>
                <h1>LearningHub</h1>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="window.history.back()">← Back to Dashboard</button>
            </div>
        </div>
    </header>

    <div class="container">

        <!-- Editor Container -->
        <div class="editor-container">
            <!-- Editor Header with Basic Info -->
            <div class="editor-header">
                <h2>Create New Course</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>Course Title *</label>
                        <input type="text" id="courseTitle" placeholder="e.g., Advanced Web Development" required>
                    </div>
                    <div class="form-group">
                        <label>Category *</label>
                        <select id="courseCategory" required>
                            <option value="">Select Category</option>
                            <option value="Web Development">Web Development</option>
                            <option value="Mobile Development">Mobile Development</option>
                            <option value="Data Science">Data Science</option>
                            <option value="Design">Design</option>
                            <option value="Business">Business</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Programming">Programming</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Duration (hours) *</label>
                        <input type="number" id="courseDuration" placeholder="e.g., 12" required>
                    </div>
                    <div class="form-group">
                        <label>Difficulty Level</label>
                        <select id="courseLevel">
                            <option value="Beginner">Beginner</option>
                            <option value="Intermediate">Intermediate</option>
                            <option value="Advanced">Advanced</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Short Description</label>
                    <textarea id="courseDescription" rows="3" placeholder="Brief overview of the course..."></textarea>
                </div>
            </div>

            <!-- Text Editor Section -->
            <div class="text-editor-section">
                <label class="editor-label">Course Content *</label>
                
                <!-- Toolbar -->
                <div class="toolbar">
                    <!-- Text Formatting -->
                    <div class="toolbar-group">
                        <button class="toolbar-btn" onclick="formatText('bold')" title="Bold"><b>B</b></button>
                        <button class="toolbar-btn" onclick="formatText('italic')" title="Italic"><i>I</i></button>
                        <button class="toolbar-btn" onclick="formatText('underline')" title="Underline"><u>U</u></button>
                        <button class="toolbar-btn" onclick="formatText('strikeThrough')" title="Strikethrough"><s>S</s></button>
                    </div>

                    <!-- Font Size -->
                    <div class="toolbar-group">
                        <select class="toolbar-select" onchange="changeFontSize(this.value)">
                            <option value="3">Normal</option>
                            <option value="1">Small</option>
                            <option value="5">Large</option>
                            <option value="7">Huge</option>
                        </select>
                    </div>

                    <!-- Headings -->
                    <div class="toolbar-group">
                        <select class="toolbar-select" onchange="formatBlock(this.value)">
                            <option value="">Paragraph</option>
                            <option value="h1">Heading 1</option>
                            <option value="h2">Heading 2</option>
                            <option value="h3">Heading 3</option>
                        </select>
                    </div>

                    <!-- Colors -->
                    <div class="toolbar-group">
                        <div class="color-picker-wrapper">
                            <input type="color" id="textColor" class="color-picker" onchange="changeTextColor(this.value)" title="Text Color">
                        </div>
                        <div class="color-picker-wrapper">
                            <input type="color" id="bgColor" class="color-picker" value="#ffff00" onchange="changeBackgroundColor(this.value)" title="Highlight Color">
                        </div>
                    </div>

                    <!-- Alignment -->
                    <div class="toolbar-group">
                        <button class="toolbar-btn" onclick="formatText('justifyLeft')" title="Align Left">⬅</button>
                        <button class="toolbar-btn" onclick="formatText('justifyCenter')" title="Align Center">↔</button>
                        <button class="toolbar-btn" onclick="formatText('justifyRight')" title="Align Right">➡</button>
                    </div>

                    <!-- Lists -->
                    <div class="toolbar-group">
                        <button class="toolbar-btn" onclick="formatText('insertUnorderedList')" title="Bullet List">• List</button>
                        <button class="toolbar-btn" onclick="formatText('insertOrderedList')" title="Numbered List">1. List</button>
                    </div>

                    <!-- Links and Images -->
                    <div class="toolbar-group">
                        <button class="toolbar-btn" onclick="openLinkModal()" title="Insert Link">🔗</button>
                        <button class="toolbar-btn" onclick="openImageModal()" title="Insert Image">🖼️</button>
                    </div>

                    <!-- Clear Formatting -->
                    <div class="toolbar-group">
                        <button class="toolbar-btn" onclick="formatText('removeFormat')" title="Clear Formatting">✖</button>
                    </div>
                </div>

                <!-- Editor Content Area -->
                <div class="editor-content" id="editor" contenteditable="true">
                    <p>Start typing your course content here...</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="editor-actions">
                <button class="btn btn-secondary" onclick="previewCourse()">👁️ Preview</button>
                <button class="btn btn-secondary" onclick="saveDraft()">💾 Save Draft</button>
                <button class="btn btn-success" onclick="publishCourse()">✓ Publish Course</button>
            </div>
        </div>
    </div>

    <!-- Link Modal -->
    <div class="modal" id="linkModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Insert Link</h3>
                <button class="close-modal" onclick="closeLinkModal()">×</button>
            </div>
            <div class="form-group">
                <label>Link Text</label>
                <input type="text" id="linkText" placeholder="Enter link text">
            </div>
            <div class="form-group">
                <label>URL</label>
                <input type="url" id="linkUrl" placeholder="https://example.com">
            </div>
            <button class="btn btn-primary" onclick="insertLink()" style="width: 100%;">Insert Link</button>
        </div>
    </div>

    <!-- Image Modal -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Insert Image</h3>
                <button class="close-modal" onclick="closeImageModal()">×</button>
            </div>
            <div class="form-group">
                <label>Image URL</label>
                <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg">
            </div>
            <div class="form-group">
                <label>Alt Text (optional)</label>
                <input type="text" id="imageAlt" placeholder="Image description">
            </div>
            <div class="form-group">
                <label>Width (optional)</label>
                <input type="text" id="imageWidth" placeholder="e.g., 500px or 100%">
            </div>
            <button class="btn btn-primary" onclick="insertImage()" style="width: 100%;">Insert Image</button>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');

        // Text formatting functions
        function formatText(command) {
            document.execCommand(command, false, null);
            editor.focus();
        }

        function formatBlock(tag) {
            if (tag) {
                document.execCommand('formatBlock', false, tag);
            }
            editor.focus();
        }

        function changeFontSize(size) {
            document.execCommand('fontSize', false, size);
            editor.focus();
        }

        function changeTextColor(color) {
            document.execCommand('foreColor', false, color);
            editor.focus();
        }

        function changeBackgroundColor(color) {
            document.execCommand('hiliteColor', false, color);
            editor.focus();
        }

        // Link Modal Functions
        function openLinkModal() {
            const selection = window.getSelection().toString();
            if (selection) {
                document.getElementById('linkText').value = selection;
            }
            document.getElementById('linkModal').classList.add('active');
        }

        function closeLinkModal() {
            document.getElementById('linkModal').classList.remove('active');
            document.getElementById('linkText').value = '';
            document.getElementById('linkUrl').value = '';
        }

        function insertLink() {
            const text = document.getElementById('linkText').value;
            const url = document.getElementById('linkUrl').value;

            if (text && url) {
                const link = `<a href="${url}" target="_blank" style="color: var(--primary); text-decoration: underline;">${text}</a>`;
                document.execCommand('insertHTML', false, link);
                closeLinkModal();
                editor.focus();
            } else {
                alert('Please enter both link text and URL');
            }
        }

        // Image Modal Functions
        function openImageModal() {
            document.getElementById('imageModal').classList.add('active');
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('active');
            document.getElementById('imageUrl').value = '';
            document.getElementById('imageAlt').value = '';
            document.getElementById('imageWidth').value = '';
        }

        function insertImage() {
            const url = document.getElementById('imageUrl').value;
            const alt = document.getElementById('imageAlt').value || 'Course Image';
            const width = document.getElementById('imageWidth').value || 'auto';

            if (url) {
                const img = `<img src="${url}" alt="${alt}" style="max-width: ${width}; height: auto; border-radius: 8px; margin: 10px 0;">`;
                document.execCommand('insertHTML', false, img);
                closeImageModal();
                editor.focus();
            } else {
                alert('Please enter an image URL');
            }
        }

        // Close modals when clicking outside
        document.getElementById('linkModal').addEventListener('click', function(e) {
            if (e.target === this) closeLinkModal();
        });

        document.getElementById('imageModal').addEventListener('click', function(e) {
            if (e.target === this) closeImageModal();
        });

        // Save Draft Function
        function saveDraft() {
            const courseData = {
                title: document.getElementById('courseTitle').value,
                category: document.getElementById('courseCategory').value,
                duration: document.getElementById('courseDuration').value,
                level: document.getElementById('courseLevel').value,
                description: document.getElementById('courseDescription').value,
                content: editor.innerHTML
            };

            console.log('Course Draft Saved:', courseData);
            alert('✓ Draft saved successfully!');
        }

        // Preview Function
        function previewCourse() {
            const content = editor.innerHTML;
            const previewWindow = window.open('', 'Preview', 'width=800,height=600');
            previewWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Course Preview</title>
                    <style>
                        body {
                            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                            padding: 40px;
                            max-width: 900px;
                            margin: 0 auto;
                            line-height: 1.6;
                        }
                        h1, h2, h3 { color: #1e293b; margin-top: 20px; }
                        img { max-width: 100%; height: auto; }
                        a { color: #2563eb; }
                    </style>
                </head>
                <body>
                    <h1>${document.getElementById('courseTitle').value || 'Untitled Course'}</h1>
                    <p><strong>Category:</strong> ${document.getElementById('courseCategory').value || 'N/A'}</p>
                    <p><strong>Duration:</strong> ${document.getElementById('courseDuration').value || 'N/A'} hours</p>
                    <p><strong>Level:</strong> ${document.getElementById('courseLevel').value}</p>
                    <hr>
                    ${content}
                </body>
                </html>
            `);
        }

        // Publish Function
        function publishCourse() {
            const title = document.getElementById('courseTitle').value;
            const category = document.getElementById('courseCategory').value;
            const duration = document.getElementById('courseDuration').value;
            const content = editor.innerHTML;

            if (!title || !category || !duration || content.trim() === '<p>Start typing your course content here...</p>') {
                alert('Please fill in all required fields and add course content.');
                return;
            }

            const courseData = {
                title: title,
                category: category,
                duration: duration,
                level: document.getElementById('courseLevel').value,
                description: document.getElementById('courseDescription').value,
                content: content,
                publishDate: new Date().toISOString()
            };

            console.log('Course Published:', courseData);
            alert('🎉 Course published successfully!');
            
            // In a real application, you would send this data to a server
            // For now, we'll just show a confirmation
        }

        // Initialize editor focus
        editor.addEventListener('focus', function() {
            if (this.innerHTML.trim() === '<p>Start typing your course content here...</p>') {
                this.innerHTML = '';
            }
        });

        // Ensure content isn't hidden behind sticky header
        function adjustBodyPaddingForHeader(){
            const header = document.querySelector('.header');
            if (!header) return;
            const rect = header.getBoundingClientRect();
            // add a small extra spacing
            document.body.style.paddingTop = (rect.height + 6) + 'px';
        }

        window.addEventListener('load', adjustBodyPaddingForHeader);
        window.addEventListener('resize', adjustBodyPaddingForHeader);
        // call once in case the header is already loaded
        adjustBodyPaddingForHeader();
    </script>
</body>
</html>
