<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#fddde6" />
  <title>Cyber Shield LinkGuard - Login</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="login.css">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png" />
  <link rel="manifest" href="../assets/favicon/site.webmanifest" />
</head>
<body>
  <div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <!-- Login Form -->
        <section id="loginForm" class="cs-card p-4">
          <div class="text-center mb-3">
            <div class="logo-container mb-3">
              <img src="../assets/CYBER_SHIELD_LINKGUARD2.png" alt="Cyber Shield LinkGuard" class="logo-image">
            </div>
            <h2 class="cs-candy-title text-center mb-3">Login</h2>
          </div>
          
          <div class="position-relative mb-3">
            <i class="bi bi-envelope input-icon"></i>
            <input id="loginEmail" class="cs-input with-icon" type="email" placeholder="Email" autocomplete="username" />
          </div>
          
          <div class="position-relative mb-3">
            <i class="bi bi-lock input-icon"></i>
            <input id="loginPass" class="cs-input with-icon" type="password" placeholder="Password" autocomplete="current-password" />
            <i class="bi bi-eye-slash toggle-password" id="togglePassword" role="button" tabindex="0" aria-label="Show password"></i>
          </div>
          
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="rememberMe">
              <label class="form-check-label small" for="rememberMe">Remember me</label>
            </div>
            <a href="../forgotPassword/forgotPassword.html" class="btn-link small">Forgot password?</a>
          </div>
          
          <button id="doLogin" class="cs-btn btn-login mb-3">
            <i class="bi bi-box-arrow-in-right me-2"></i>LOGIN
          </button>
          
          <div class="text-end mb-3">
            <span class="small">Don't have an account? </span>
            <a href="../signup/signup.html" class="btn-link small">Sign up</a>
          </div>
        </section>
        
        <footer class="text-center cs-sub mt-4">© Msebetsi Solutions Pty Ltd</footer>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../session.js"></script>
  <script src="login.js"></script>
</body>
</html>
