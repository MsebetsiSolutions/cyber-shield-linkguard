<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fddde6" />
  <title>Cyber Shield LinkGuard - Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png" />
  <link rel="manifest" href="../assets/favicon/site.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-touch-icon.png">
</head>

<body>
  <div class="user-controls">
    <span id="userNameDisplay" class="user-name">User Name</span>
    <button class="user-dropdown-btn" id="userDropdownBtn" type="button" aria-label="User Menu" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight" aria-controls="offcanvasRight">
      <i class="bi bi-person-circle"></i>
    </button>
    <button id="logout" class="logout-btn" type="button" aria-label="Logout">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
  <div class="container-fluid py-3">
    <div class="row mb-3">
      <div class="col-12">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <a href="../ScannerDash/ScannerDash.html"> <img src="../assets/CYBER_SHIELD_LINKGUARD2.png"
                alt="Cyber Shield LinkGuard" class="header-logo me-2"> </a>
          </div>
        </div>
      </div>
    </div>
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10">
        <div class="row">
          <div class="col-12 col-md-6 mb-3">
            <div class="cs-card p-3 h-100">
              <h4 class="mb-2"><i class="bi bi-person-circle me-1"></i>Profile Information</h4>
              <form id="profileForm">
                <div class="mb-2">
                  <label for="userName" class="form-label">
                    <i class="bi bi-person me-1"></i> Full Name
                  </label>
                  <input type="text" class="cs-input" id="userName" placeholder="Enter your full name">
                </div>
                <div class="mb-2">
                  <label for="userEmail" class="form-label">
                    <i class="bi bi-envelope me-1"></i> Email Address
                  </label>
                  <input type="email" class="cs-input" id="userEmail" placeholder="Enter your email address">
                </div>
                <div class="mb-3">
                  <label for="userPhone" class="form-label">
                    <i class="bi bi-telephone me-1"></i> Cell Phone Number
                  </label>
                  <input type="tel" class="cs-input" id="userPhone" placeholder="Enter your cell phone number">
                </div>
                <button type="submit" class="cs-btn btn-save w-100">Save Changes</button>
              </form>
            </div>
          </div>
          <div class="col-12 col-md-6 mb-3">
            <div class="cs-card p-3 h-100">
              <h4 class="mb-2"><i class="bi bi-shield-lock me-1"></i>Change Password</h4>
              <form id="passwordForm">
                <div class="mb-2">
                  <label for="currentPassword" class="form-label">Current Password</label>
                  <input type="password" class="cs-input" id="currentPassword" placeholder="Enter current password">
                </div>
                <div class="mb-2">
                  <label for="newPassword" class="form-label">New Password</label>
                  <input type="password" class="cs-input" id="newPassword"
                    placeholder="Enter new password (min 6 characters)">
                </div>
                <div class="mb-3">
                  <label for="confirmPassword" class="form-label">Confirm New Password</label>
                  <input type="password" class="cs-input" id="confirmPassword" placeholder="Confirm new password">
                </div>
                <div id="passwordError" class="alert alert-danger hidden" role="alert"></div>
                <button type="submit" class="cs-btn btn-save w-100">Update Password</button>
              </form>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-12">
            <div class="cs-card p-3">
              <h4 class="mb-2"><i class="bi bi-gear me-1"></i>Account Actions</h4>
              <div class="d-grid gap-2">
                <a href="../supcom/supcom.html" class="cs-btn btn-secondary text-decoration-none">
                  <i class="bi bi-headset me-1"></i>Contact Support
                </a>
                <button class="cs-btn btn-danger" data-bs-toggle="modal" data-bs-target="#deleteAccountModal">
                  <i class="bi bi-trash me-1"></i>Delete Account
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="modal fade" id="deleteAccountModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content cs-card">
        <div class="modal-header">
          <h5 class="modal-title">Confirm Account Deletion</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="mb-2">Are you sure you want to delete your account? This action cannot be undone. All your data will be
            permanently removed.</p>
          <div class="mb-2">
            <label for="deletePassword" class="form-label">Enter your password to confirm</label>
            <input type="password" class="cs-input" id="deletePassword" placeholder="Your password">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="cs-btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="cs-btn btn-danger" id="confirmDelete">Delete Account</button>
        </div>
      </div>
    </div>
  </div>
  <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="offcanvasRightLabel">User Menu</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <div id="welcomeMessage" class="user-welcome"></div>
      <div class="user-menu-items">
        <a href="../ScannerDash/ScannerDash.html" class="user-menu-item">
          <i class="bi bi-speedometer2 me-2"></i>Scanner Dash
        </a>
        <a href="../profile/profile.html" class="user-menu-item">
          <i class="bi bi-person me-2"></i>Profile
        </a>
        <a href="../Subscription/Subscription.html" class="user-menu-item">
          <i class="bi bi-star-fill me-2"></i>Subscription
        </a>
        <a href="../report/report.html" class="user-menu-item">
          <i class="bi bi-flag me-2"></i>Report
        </a>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../session.js"></script>
  <script src="settings.js"></script>
</body>

</html>
