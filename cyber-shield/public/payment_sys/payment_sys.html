<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#f0f4f8" />
  <title>Cyber Shield LinkGuard - Payment</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="payment_sys.css">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png" />
  <link rel="manifest" href="assets/favicon/site.webmanifest" />
</head>
<body> 
  <!-- User Info and Controls -->
  <div class="user-controls">
    <span id="userNameDisplay" class="user-name">User Name</span>
    <div class="user-dropdown">
      <button class="user-dropbtn" id="userDropdownBtn">
        <i class="bi bi-person-circle"></i>
      </button>
      <div class="user-dropdown-content" id="userDropdown">
        <div id="welcomeMessage" class="user-welcome"></div>
        <a href="../profile/profile.html"><i class="bi bi-person me-2"></i>Profile</a>
        <a href="../settings/settings.html"><i class="bi bi-gear me-2"></i>Settings</a>
        <a href="../Subscription/Subscription.html"><i class="bi bi-star-fill me-2"></i>Subscription</a>
        <a href="../report/report.html"><i class="bi bi-flag me-2"></i>Report</a>
      </div>
    </div>
    <button id="logout" class="logout-btn">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>

  <div class="container-fluid py-4">
    <!-- Header -->
    <div class="row mb-4">
      <div class="col-12">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <a href="../ScannerDash/ScannerDash.html"> <img src="../assets/CYBER_SHIELD_LINKGUARD2.png" alt="Cyber Shield LinkGuard" class="header-logo me-3"> </a>
            <div class="cs-sub small mt-1">Complete your subscription</div>
          </div>
          <div class="d-flex gap-2">
            <a href="../Subscription/Subscription.html" class="cs-btn btn-settings">
              <i class="bi bi-arrow-left me-1"></i> <span class="d-none d-md-inline">Back to Plans</span>
            </a>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-12 col-lg-8 col-xl-6 mx-auto">
        <div class="cs-card p-4">
          <h2 class="text-center mb-4 cs-candy-title">Secure Payment</h2>
          
          <!-- Selected Plan Info -->
          <div class="selected-plan mb-4 p-3 rounded" id="selectedPlanInfo">
            <h4 class="text-center mb-2"><i class="bi bi-star-fill me-2 text-warning"></i>Selected Plan: <span id="planName"></span></h4>
            <p class="text-center mb-1">Price: <span id="planPrice" class="fw-bold"></span></p>
            <p class="text-center mb-0">Plan Code: <span id="planCode" class="fw-bold"></span></p>
          </div>
          
          <form id="paymentForm">
            <div class="row">
              <div class="col-12 col-md-6">
                <div class="mb-3">
                  <label for="cardNumber" class="form-label"><i class="bi bi-credit-card me-2"></i>Card Number</label>
                  <input type="text" class="form-control cs-input" id="cardNumber" placeholder="0000 0000 0000 0000" required>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <div class="mb-3">
                  <label for="cardName" class="form-label"><i class="bi bi-person me-2"></i>Name on Card</label>
                  <input type="text" class="form-control cs-input" id="cardName" placeholder="Name Surname" required>
                </div>
              </div>
            </div>
            
            <div class="row">
              <div class="col-12 col-md-4">
                <div class="mb-3">
                  <label for="expiryDate" class="form-label"><i class="bi bi-calendar-date me-2"></i>Expiry Date</label>
                  <input type="text" class="form-control cs-input" id="expiryDate" placeholder="MM/YY" required>
                </div>
              </div>
              <div class="col-12 col-md-4">
                <div class="mb-3">
                  <label for="cvv" class="form-label"><i class="bi bi-key me-2"></i>CVV</label>
                  <input type="text" class="form-control cs-input" id="cvv" placeholder="000" required>
                </div>
              </div>
              <div class="col-12 col-md-4">
                <div class="mb-3">
                  <label for="zipCode" class="form-label"><i class="bi bi-geo-alt me-2"></i>ZIP Code</label>
                  <input type="text" class="form-control cs-input" id="zipCode" placeholder="12345" required>
                </div>
              </div>
            </div>
            
            <div class="mb-4">
              <label for="email" class="form-label"><i class="bi bi-envelope me-2"></i>Email Address</label>
              <input type="email" class="form-control cs-input" id="email" placeholder="your@email.com" required>
            </div>
            
            <button type="submit" class="cs-btn btn-login w-100">
              <i class="bi bi-lock-fill me-2"></i>Complete Payment
            </button>
          </form>
          
          <div class="text-center mt-4">
            <p class="cs-sub small d-flex align-items-center justify-content-center">
              <i class="bi bi-shield-lock-fill me-2 text-success fs-5"></i>
              Your payment is secure and encrypted. We do not store your card details.
            </p>
            <div class="d-flex justify-content-center gap-3 mt-2">
              <i class="bi bi-visa fs-3 text-primary"></i>
              <i class="bi bi-mastercard fs-3 text-danger"></i>
              <i class="bi bi-credit-card-fill fs-3 text-info"></i>
              <i class="bi bi-paypal fs-3 text-primary"></i>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="text-center cs-sub mt-4">© Msebetsi Solutions Pty Ltd</footer>
  </div>

  <div id="toast"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../session.js"></script>
  <script src="payment_sys.js"></script>
</body>
</html>
