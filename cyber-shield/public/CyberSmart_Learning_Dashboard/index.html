<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberSmart Learning Platform</title>
  <style>
    body {
      font-family: "Comic Sans MS", "Poppins", sans-serif;
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      margin: 0;
      padding: 0;
      text-align: center;
      color: #333;
    }

    header {
      background: #ff8c42;
      color: white;
      padding: 30px 0;
      font-size: 2em;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      color: #444;
      margin-top: 20px;
      font-size: 1.3em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      padding: 40px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .grade-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      padding: 30px;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
    }

    .grade-card:hover {
      transform: scale(1.05);
      background: #ffe8d6;
    }

    .emoji {
      font-size: 3em;
      display: block;
      margin-bottom: 10px;
    }

    footer {
      background: #ff8c42;
      color: white;
      padding: 15px;
      font-size: 0.9em;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      header {
        font-size: 1.5em;
      }
      .grid {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <header>🌟 CyberSmart Learning Platform 🌟</header>
  <h2>Welcome! Choose your grade to begin your Cyber Journey 🚀</h2>

  <div class="grid">
    <div class="grade-card" onclick="location.href='Grade R - My Digital World/Grade R (My Digital World-Staying safe & Smart).html'">
      <span class="emoji">🧸</span>
      <strong>Grade R</strong><br>
      My Digital World
    </div>

    <div class="grade-card" onclick="location.href='Grade 1 and 2 cybersecurity course/What is the Internet.html'">
      <span class="emoji">🧩</span>
      <strong>Grade 1–2</strong><br>
      What is the Internet
    </div>

    <div class="grade-card" onclick="location.href='Grade 3 & 4 - Cyber Agents/Grade 3 & 4 - Cyber Agents/deepseek_html_20251022_4d1173.html'">
      <span class="emoji">🦸</span>
      <strong>Grade 3–4</strong><br>
      Cyber Agents
    </div>

    <div class="grade-card" onclick="location.href='Grade 5 & 6 - Future Cyber Defenders/1761212462815_deepseek_html_20251022_2bb08a.html'">
      <span class="emoji">🛡️</span>
      <strong>Grade 5–6</strong><br>
      Future Cyber Defenders
    </div>
  </div>

  <footer>© 2025 CyberSmart Learning | Built by Msebetsi Solutions Pty Ltd </footer>

</body>
</html>
