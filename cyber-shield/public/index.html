<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fddde6" />
  <title>Cyber Shield LinkGuard - Secure Link Protection</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

  <link rel="stylesheet" href="theme.css">

  <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-132x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png" />
    <link rel="manifest" href="assets/favicon/site.webmanifest" />
</head>

<body>
  <div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <!-- Welcome Screen -->
        <section id="welcomeScreen" class="cs-card p-4">
          <div class="text-center mb-4">
            <div class="logo-container mb-3">
              <img src="assets/CYBER_SHIELD_LINKGUARD2.png" alt="Cyber Shield LinkGuard" class="logo-image">
            </div>
            <div class="security-badge">
              <span class="badge bg-success mt-2">
                <i class="bi bi-lock-fill me-1"></i>End-to-End Encryption
              </span>
            </div>
          </div>
          <div class="cs-card mb-4 p-3 security-features">
            <p class="cs-sub mb-0 text-center">Protect yourself from malicious links, files, and QR codes. Privacy-first
              security solution.</p>
            <div class="d-flex justify-content-center mt-3">
              <div class="feature-item me-3">
                <i class="bi bi-shield-check"></i>
                <small>URL Scanning</small>
              </div>
              <div class="feature-item me-3">
                <i class="bi bi-file-lock"></i>
                <small>File Scanning</small>
              </div>
              <div class="feature-item">
                <i class="bi bi-qr-code"></i>
                <small>QR Scanning</small>
              </div>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-6 mb-2">
              <button id="btnLogin" class="cs-btn btn-login w-100">
                <i class="bi bi-box-arrow-in-right me-2"></i>LOGIN
              </button>
            </div>
            <div class="col-md-6 mb-2">
              <button id="btnSignup" class="cs-btn btn-signup w-100">
                <i class="bi bi-person-plus me-2"></i>SIGNUP
              </button>
            </div>
          </div>

          <div class="text-center mt-3">
            <small class="text-muted">
              <i class="bi bi-info-circle me-1"></i>
              Your privacy is protected
            </small>
          </div>
        </section>
      </div>

      <footer class="text-center cs-sub mt-4">© Msebetsi Solutions Pty Ltd</footer>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="logg.js"></script>
</body>

</html>
