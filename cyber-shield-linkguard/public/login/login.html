<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#fddde6" />
  <title>Cyber Shield LinkGuard - Login</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <!-- Login Form -->
        <section id="loginForm" class="cs-card p-4">
          <div class="text-center mb-3">
            <i class="bi bi-shield-check cs-candy-title" style="font-size: 2.5rem;"></i>
            <h2 class="cs-candy-title text-center mb-3">Login</h2>
          </div>
          
          <div class="position-relative mb-3">
            <i class="bi bi-envelope input-icon"></i>
            <input id="loginEmail" class="cs-input with-icon" type="email" placeholder="Email" autocomplete="username" />
          </div>
          
          <div class="position-relative mb-3">
            <i class="bi bi-lock input-icon"></i>
            <input id="loginPass" class="cs-input with-icon" type="password" placeholder="Password" autocomplete="current-password" />
            <i class="bi bi-eye-slash toggle-password" id="togglePassword"></i>
          </div>
          
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="rememberMe">
              <label class="form-check-label small" for="rememberMe">Remember me</label>
            </div>
            <button id="forgotPasswordLink" class="btn-link small">Forgot password?</button>
          </div>
          
          <button id="doLogin" class="cs-btn btn-login mb-3">
            <i class="bi bi-box-arrow-in-right me-2"></i>LOGIN
          </button>
          
          <div class="text-end mb-3">
            <span class="small">Don't have an account? </span>
            <button id="signupLink" class="btn-link small">Sign up</button>
          </div>
          
          <div class="text-center">
            <button id="backToWelcome" class="btn-link">
              <i class="bi bi-arrow-left me-2"></i>Back to Welcome
            </button>
          </div>
        </section>

        <!-- Forgot Password Form -->
        <section id="forgotPasswordForm" class="cs-card p-4 hidden">
          <div class="text-center mb-3">
            <i class="bi bi-shield-check cs-candy-title" style="font-size: 2.5rem;"></i>
            <h2 class="cs-candy-title text-center mb-3">Reset Password</h2>
            <p class="cs-sub">Enter your email and complete the verification to reset your password</p>
          </div>
          
          <div class="position-relative mb-3">
            <i class="bi bi-envelope input-icon"></i>
            <input id="resetEmail" class="cs-input with-icon" type="email" placeholder="Email" autocomplete="username" />
          </div>
          
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <label class="small">Verification Code</label>
              <button type="button" id="refreshCaptcha" class="btn-link small">
                <i class="bi bi-arrow-clockwise"></i> Refresh
              </button>
            </div>
            <div class="d-flex align-items-center">
              <div id="captchaDisplay" class="captcha-display me-2"></div>
              <input id="captchaInput" class="cs-input" type="text" placeholder="Enter code" />
            </div>
          </div>
          
          <div class="position-relative mb-3">
            <i class="bi bi-lock input-icon"></i>
            <input id="newPassword" class="cs-input with-icon" type="password" placeholder="New Password" autocomplete="new-password" />
            <i class="bi bi-eye-slash toggle-password" id="toggleNewPassword"></i>
          </div>
          
          <div class="position-relative mb-3">
            <i class="bi bi-lock input-icon"></i>
            <input id="confirmPassword" class="cs-input with-icon" type="password" placeholder="Confirm New Password" autocomplete="new-password" />
            <i class="bi bi-eye-slash toggle-password" id="toggleConfirmPassword"></i>
          </div>
          
          <button id="doReset" class="cs-btn btn-login mb-3">
            <i class="bi bi-send me-2"></i>RESET PASSWORD
          </button>
          
          <div class="text-center">
            <button id="backToLogin" class="btn-link">
              <i class="bi bi-arrow-left me-2"></i>Back to Login
            </button>
          </div>
        </section>
        
        <footer class="text-center cs-sub mt-4">© Msebetsi Solutions Pty Ltd</footer>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="login.js"></script>
</body>
</html>
