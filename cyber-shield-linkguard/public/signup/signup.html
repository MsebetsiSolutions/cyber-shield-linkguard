<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#fddde6" />
  <title>Cyber Shield LinkGuard - Sign Up</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="/public/signup/signup.css">
</head>
<body>
  <div class="container-fluid min-vh-100 d-flex flex-column">
    <div class="row flex-grow-1 justify-content-center align-items-center">
      <div class="col-12 col-md-6 col-lg-4">
        
        <section class="cs-card p-4">
          <div class="text-center mb-4">
            <i class="bi bi-shield-check icon-title"></i>
            <h2 class="cs-candy-title mb-0">Create Account</h2>
            <p class="cs-sub">Join Cyber Shield LinkGuard for enhanced security</p>
          </div>
          
          <div class="mb-3 position-relative">
            <i class="bi bi-envelope input-icon"></i>
            <input name="email" id="suEmail" class="cs-input with-icon" type="email" placeholder="Email address" autocomplete="email" required/>
          </div>
          
          <div class="mb-3 position-relative">
            <i class="bi bi-lock input-icon"></i>
            <input name="password" id="suPass" class="cs-input with-icon" type="password" placeholder="Password (min 6 characters)" autocomplete="new-password" required/>
            <i class="bi bi-eye toggle-password" id="togglePassword"></i>
          </div>
          
          <div class="mb-3 position-relative">
            <i class="bi bi-lock-fill input-icon"></i>
            <input name="passConfirm" id="suPassConfirm" class="cs-input with-icon" type="password" placeholder="Confirm password" autocomplete="new-password" required/>
            <i class="bi bi-eye toggle-password" id="togglePasswordConfirm"></i>
          </div>
          
          <div id="passwordError" class="alert alert-danger hidden mb-3" role="alert">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <span id="passwordErrorText"></span>
          </div>
          
          <div class="password-strength mb-3 hidden" id="passwordStrength">
            <div class="progress" style="height: 5px;">
              <div id="passwordStrengthBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
            </div>
            <small id="passwordStrengthText" class="form-text"></small>
          </div>
          
          <button id="doSignup" class="cs-btn btn-signup w-100 mb-3">
            <i class="bi bi-person-plus me-2"></i>SIGN UP
          </button>
          
          <div class="text-end">
            <p class="cs-sub">Already have an account? <button id="backToLogin" class="btn-link">Log in here</button></p>
          </div>
        </section>
      </div>
    </div>
    
    <!-- Footer -->
    <div class="row mt-auto">
      <div class="col-12">
        <footer class="text-center cs-sub py-3">© Msebetsi Solutions Pty Ltd</footer>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/signup/signup.js"></script>
</body>
</html>
